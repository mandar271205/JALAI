    native_cadence_minutes: 60
    canonical_resolution: "0.002 deg (~200 m)"
    availability_semantics: "latest_prior_cycle_as_of_issue_time"
    temporal_mode: "issue_time_context"
    normalization:
      kind: "standard_zscore"
      fitted_split: "train"
      train_mean: 4.85
      train_std: 3.92
    missing_data_behavior: "zero_fill_with_missing_channel_mask"
    REAL_DATA: true
    operational_status: "ACTIVE_REPLAY_ANCILLARY"

  gfs_v10:
