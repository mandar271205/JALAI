version: "multisource_channels_v1"
created_at: "2026-09-08T22:20:00Z"
description: "Input channel inventory and semantics manifest for Phase 4E deep nowcasting tournament"

channels:
  rainfall_gpm:
    name: "rainfall_gpm"
    source: "NASA GPM IMERG Final Run V07"
    variable: "precipitationCal"
    units: "mm/h"
    physical_range: [0.0, 300.0]
    native_resolution: "0.1 deg (~10 km)"
    native_cadence_minutes: 30
    canonical_resolution: "0.002 deg (~200 m, 128x128 crop or 256x256 MMR)"
    availability_semantics: "as_of_issue_time_historical_window"
    temporal_mode: "sequential_history"
    history_length_steps: 4
    normalization:
      kind: "log1p_percentile_scale"
      fitted_split: "train"
      train_scale_parameter: 1.8344
    missing_data_behavior: "fail_closed_for_observation"
    REAL_DATA: true
    operational_status: "ACTIVE_OPERATIONAL"

  gfs_precipitation:
    name: "gfs_precipitation"
    source: "NOAA GFS 0.25-deg Operational Numerical Weather Prediction"
    variable: "prate"
    units: "mm/h"
    physical_range: [0.0, 250.0]
    native_resolution: "0.25 deg (~25 km)"
    native_cadence_minutes: 60
    canonical_resolution: "0.002 deg (~200 m, 128x128 crop or 256x256 MMR)"
    availability_semantics: "latest_prior_cycle_as_of_issue_time"
    temporal_mode: "forecast_horizons_plus_30_to_120"
    normalization:
      kind: "log1p_percentile_scale"
      fitted_split: "train"
      train_scale_parameter: 1.8344
    missing_data_behavior: "zero_fill_with_missing_channel_mask"
    REAL_DATA: true
    operational_status: "ACTIVE_REPLAY"

  gfs_u10:
    name: "gfs_u10"
    source: "NOAA GFS 0.25-deg"
