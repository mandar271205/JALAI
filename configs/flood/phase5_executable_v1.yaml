contract_version: phase5_executable_v1
execution_state: READY
scientific_claims:
  susceptibility_is_depth: false
  calibrated_depth_available: false
  genuine_physics_corpus_available: false
  fno_training_allowed: false
  citizen_real_ml_available: false
  locked_test_untouched: true

susceptibility:
  engine_version: relative_susceptibility_v1
  quantity: relative_flood_susceptibility
  units: dimensionless
  calibrated_depth: false
  required_grid:
    crs: EPSG:32643
    shape: [256, 256]
  features:
    elevation:
      path: data/processed/static/elevation.tif
      weight: 0.30
      policy: REQUIRED
    slope:
      path: data/processed/static/slope.tif
      weight: 0.25
      policy: REQUIRED
    low_lying_index:
      path: data/processed/static/low_lying_index.tif
      weight: 0.25
      policy: REQUIRED
    distance_to_water:
      path: data/processed/static/distance_to_water.tif
      weight: 0.20
      policy: REQUIRED
    flow_accumulation:
      path: data/processed/static/flow_accumulation.tif
      policy: OPTIONAL
  output: data/processed/flood/susceptibility_v1.tif
  audit: reports/phase5_susceptibility_audit.json

physics:
  scenario_manifest: data/processed/flood/physics_scenarios_v1.json
  solvers: [SWMM, LISFLOOD-FP]
  rainfall_units: mm/h
  depth_units: m
  calibrated_default: false
  missing_inputs_status: BLOCKED_MISSING_INPUT
  missing_solver_status: BLOCKED_MISSING_SOLVER
  output_root: data/processed/flood/physics_runs_v1
  audit: reports/phase5_physics_audit.json

physics_dataset:
  manifest: data/processed/flood/physics_dataset_v1.json
  split_unit: scenario_id
  event_isolation_required: true
  target_quantity: physics_simulated_water_depth
  require_physically_simulated: true
  reject_susceptibility_target: true
  reject_synthetic_depth: true

fno:
  model_version: flood_fno_v1
  output_type: water_depth_m
  surrogate_model: true
  physics_reference_required: true
  normalization: models/flood/fno_train_only_normalization_v1.json
  checkpoint_root: models/flood/fno_v1
  metrics:
    - depth_mae_m
    - depth_rmse_m
    - wet_cell_mae_m
    - wet_cell_bias_m
    - inundation_iou
    - inundation_csi
    - precision
    - recall
    - peak_depth_error_m
    - spatial_extent_error_cells
    - runtime_seconds
    - measured_speedup

exposure:
  allowed_classes:
    - population
    - buildings
    - roads
    - schools
    - hospitals
    - emergency_facilities
    - critical_infrastructure
    - transport_assets
  require_provenance: true
  aggregation: [raster, H3]
  normalize_scale: true

vulnerability:
  methodology: heuristic_expert_weighted
  separate_from_exposure: true
  require_sourced_factors: true
  min_required_factors: 2
  insufficient_data_status: VULNERABILITY_DATA_INSUFFICIENT

risk:
  methodology_version: probabilistic_hev_v1
  components: [hazard, exposure, vulnerability]
  categories: [LOW, MODERATE, HIGH, SEVERE]
  explicit_normalization_required: true
  distinguish: [data_quality, model_confidence, risk_probability]

uncertainty:
  propagation_unit: scenario_ensemble
  quantiles: [p10, p50, p90]
  pixel_independent_bootstrap_prohibited: true
  calibrated_probability_claim_requires_calibration: true

explainability:
  unsupported_causal_claims_prohibited: true
  components: [rainfall, terrain_or_flood, exposure, vulnerability, uncertainty, data_quality, limitations, versions]

citizen_verification:
  ml_verification_available: false
  heuristic_verification_ready: true
  categories: [VERIFIED, LIKELY, UNCERTAIN, CONFLICTING, INSUFFICIENT_EVIDENCE]
