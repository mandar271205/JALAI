user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" trace_id="$http_x_trace_id"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Rate limiting zone (100 req/s with burst)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream titiler_upstream {
        server titiler:8000;
    }

    upstream tileserv_upstream {
        server pg_tileserv:7800;
    }

    # HTTP Server - Standard / TLS-ready redirect profile
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Health probe (direct pass-through without rate limits)
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket Live State connection & protocol upgrade
        location /api/v1/live {
            proxy_pass http://backend_upstream/api/v1/live;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Raster tiles proxy to TiTiler
        location /tiles/raster/ {
            proxy_pass http://titiler_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Vector tiles proxy to pg_tileserv
        location /tiles/vector/ {
            proxy_pass http://tileserv_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Public API Gateway
        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security response headers
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
