[project]
name = "jalrakshak-backend"
version = "0.1.0"
description = "JalRakshak AI - Backend + Platform Engineering (SIH26071)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.4",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "minio>=7.2.7",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "jsonschema>=4.22.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "greenlet>=3.0.0",
    "ortools>=9.10.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app", "."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
